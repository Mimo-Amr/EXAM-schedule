<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Egypt IGCSE 2026</title>
<style>
/* ── SYSTEM FONT STACKS — zero external deps ── */
:root{
  --font-display: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  --font-body:    'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono:    'Cascadia Code','Fira Code','SF Mono','Consolas','Courier New',monospace;

  --bg:#09090f;--sur:#111118;--sur2:#16161e;
  --brd:rgba(255,255,255,.07);--brd2:rgba(255,255,255,.14);
  --txt:#eeeef2;--mut:#50505f;--mut2:#888899;
  --acc:#f4a13a;--acc2:rgba(244,161,58,.08);
  --phy:#3b9eff;--bio:#3ecf8e;--che:#a78bfa;
  --mat:#f4a13a;--esl:#f472b6;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--txt);
  font-family:var(--font-body);
  min-height:100vh;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ── CANVAS ── */
#cvs{position:fixed;inset:0;z-index:0;pointer-events:none}

/* ── HEADER ── */
header{
  position:sticky;top:0;z-index:200;
  background:rgba(9,9,15,.9);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--brd);
}
.hdr{
  max-width:960px;margin:0 auto;
  padding:0 clamp(14px,3vw,40px);
  height:62px;display:flex;align-items:center;
  justify-content:space-between;gap:12px;
}
.logo{
  font-family:var(--font-display);
  font-size:15px;font-weight:700;
  letter-spacing:.02em;white-space:nowrap;
}
.logo span{color:var(--acc)}

.clk{text-align:right;line-height:1.45}
#clk-d{font-family:var(--font-mono);font-size:10px;color:var(--mut2);display:block}
#clk-t{font-family:var(--font-mono);font-size:clamp(14px,2.4vw,19px);font-weight:600;color:var(--txt);display:block;letter-spacing:.02em}

/* ── MAIN ── */
main{
  max-width:960px;margin:0 auto;
  padding:clamp(14px,3vw,36px);
  position:relative;z-index:1;
}

/* ── TABS ── */
.tabs{
  display:flex;gap:4px;background:var(--sur);
  border:1px solid var(--brd);border-radius:10px;
  padding:3px;width:fit-content;margin-bottom:18px;
}
.tab{
  padding:7px 22px;border-radius:7px;border:none;
  background:transparent;color:var(--mut2);
  font-family:var(--font-body);font-size:13px;font-weight:500;
  cursor:pointer;transition:all .18s;
  display:flex;align-items:center;gap:6px;
}
.tab .cnt{font-size:11px;background:rgba(255,255,255,.08);border-radius:99px;padding:1px 7px}
.tab.active{background:var(--acc);color:#09090f}
.tab.active .cnt{background:rgba(0,0,0,.18);color:#09090f}
.tab:hover:not(.active){background:var(--sur2);color:var(--txt)}

/* ── FILTERS ── */
.fbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:24px;align-items:center}
.fcat{font-size:11px;font-weight:600;color:var(--mut);letter-spacing:.07em;text-transform:uppercase;margin-right:2px}
.fb{
  padding:5px 14px;border-radius:99px;
  border:1px solid var(--brd);background:transparent;
  color:var(--mut2);font-family:var(--font-body);
  font-size:12px;cursor:pointer;transition:all .18s;
  display:flex;align-items:center;gap:5px;white-space:nowrap;
}
.fb .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.fb:hover{border-color:var(--brd2);color:var(--txt)}
.fb.active{border-color:transparent;color:#09090f;font-weight:600}
.fb[data-f="all"].active{background:var(--txt)}
.fb[data-f="phy"].active{background:var(--phy)}
.fb[data-f="bio"].active{background:var(--bio)}
.fb[data-f="che"].active{background:var(--che)}
.fb[data-f="mat"].active{background:var(--mat)}
.fb[data-f="esl"].active{background:var(--esl)}

/* ── CARD LIST ── */
#list{display:flex;flex-direction:column;gap:7px}

.card{
  background:var(--sur);border:1px solid var(--brd);
  border-radius:13px;padding:15px 17px;
  display:flex;align-items:center;gap:14px;
  position:relative;overflow:hidden;
  opacity:0;transform:translateY(14px);
  animation:si .38s ease-out forwards;
  transition:border-color .18s,transform .18s;
}
.card:hover{border-color:var(--brd2);transform:translateY(-1px)}
@keyframes si{to{opacity:1;transform:translateY(0)}}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px}

.c-phy::before{background:var(--phy)} .c-bio::before{background:var(--bio)}
.c-che::before{background:var(--che)} .c-mat::before{background:var(--mat)}
.c-esl::before{background:var(--esl)}

/* done */
.done{background:rgba(14,14,20,.55);border-color:rgba(255,255,255,.03)}
.done::before{opacity:.18}
.done .dday,.done .dmo,.done .dwk,.done .dsubj,.done .dpap,.done .dcode{color:#252530!important}
.done .badge,.done .pip,.done .cdwn{opacity:.18}
.done:hover{transform:none;border-color:rgba(255,255,255,.03)}

/* date block */
.db{min-width:46px;text-align:center;flex-shrink:0}
.dday{font-family:var(--font-display);font-size:23px;font-weight:700;line-height:1;color:var(--txt)}
.dmo{font-size:10px;color:var(--mut);margin-top:1px;letter-spacing:.03em;text-transform:uppercase}
.dwk{font-size:10px;color:var(--mut);margin-top:0}

/* divider */
.dvd{width:1px;align-self:stretch;background:var(--brd);flex-shrink:0}

/* info */
.di{flex:1;min-width:0}
.dsubj{font-family:var(--font-display);font-size:14px;font-weight:700;color:var(--txt);margin-bottom:2px}
.dpap{font-size:11px;color:var(--mut2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcode{font-family:var(--font-mono);font-size:10px;color:var(--mut);margin-top:3px}

/* right */
.dr{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.badge{
  font-family:var(--font-mono);font-size:12px;font-weight:500;
  color:var(--txt);background:var(--sur2);
  border:1px solid var(--brd);border-radius:7px;
  padding:3px 9px;white-space:nowrap;
}
.pip{font-size:10px;padding:2px 8px;border-radius:99px;font-weight:600;white-space:nowrap}
.p-phy{background:rgba(59,158,255,.12);color:var(--phy)}
.p-bio{background:rgba(62,207,142,.12);color:var(--bio)}
.p-che{background:rgba(167,139,250,.12);color:var(--che)}
.p-mat{background:rgba(244,161,58,.12);color:var(--mat)}
.p-esl{background:rgba(244,114,182,.12);color:var(--esl)}
.cdwn{font-size:10px;font-weight:600;white-space:nowrap}
.today{color:#f87171}.soon{color:var(--acc)}.future{color:var(--mut2)}.cdone{color:#252530}

/* note */
.note{
  font-size:11px;color:var(--mut2);
  background:var(--sur);border:1px solid var(--brd);
  border-radius:10px;padding:.7rem 1rem;
  margin-top:6px;line-height:1.8;
}
.empty{text-align:center;padding:56px 0;color:var(--mut);font-size:13px}

@media(max-width:500px){
  .dr{display:none}
  .card{padding:12px 13px}.dday{font-size:19px}
  .tabs{width:100%}.tab{flex:1;justify-content:center;padding:7px 8px;font-size:12px}
}
</style>
</head>
<body>

<canvas id="cvs"></canvas>

<header>
  <div class="hdr">
    <div class="logo">Egypt IGCSE <span>2026</span></div>
    <div class="clk">
      <span id="clk-d"></span>
      <span id="clk-t"></span>
    </div>
  </div>
</header>

<main>
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="upcoming">Upcoming <span class="cnt" id="uc">0</span></button>
    <button class="tab" data-tab="done">Done <span class="cnt" id="dc">0</span></button>
  </div>
  <div class="fbar" id="fbar">
    <span class="fcat">Filter</span>
    <button class="fb active" data-f="all"><span class="dot" style="background:#777"></span>All</button>
    <button class="fb" data-f="phy"><span class="dot" style="background:var(--phy)"></span>Physics</button>
    <button class="fb" data-f="bio"><span class="dot" style="background:var(--bio)"></span>Biology</button>
    <button class="fb" data-f="che"><span class="dot" style="background:var(--che)"></span>Chemistry</button>
    <button class="fb" data-f="mat"><span class="dot" style="background:var(--mat)"></span>Maths</button>
    <button class="fb" data-f="esl"><span class="dot" style="background:var(--esl)"></span>English ESL</button>
  </div>
  <div id="list"></div>
</main>

<script>
/* ═══════════════════════════════
   PARTICLES
═══════════════════════════════ */
(function(){
  const cvs=document.getElementById('cvs'),ctx=cvs.getContext('2d');
  let W,H;
  const N=75,DIST=125,SPD=0.35;
  const pts=[];

  function resize(){W=cvs.width=innerWidth;H=cvs.height=innerHeight;}
  resize();addEventListener('resize',resize);

  for(let i=0;i<N;i++)pts.push({
    x:Math.random()*innerWidth, y:Math.random()*innerHeight,
    vx:(Math.random()-.5)*SPD*2, vy:(Math.random()-.5)*SPD*2,
    r:1+Math.random()*1.5
  });

  function frame(){
    ctx.clearRect(0,0,W,H);
    pts.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0||p.x>W)p.vx*=-1;
      if(p.y<0||p.y>H)p.vy*=-1;
    });
    for(let i=0;i<N;i++){
      for(let j=i+1;j<N;j++){
        const dx=pts[i].x-pts[j].x, dy=pts[i].y-pts[j].y;
        const d=Math.sqrt(dx*dx+dy*dy);
        if(d<DIST){
          const a=(1-d/DIST)*0.20;
          ctx.beginPath();
          ctx.strokeStyle=`rgba(244,161,58,${a})`;
          ctx.lineWidth=0.7;
          ctx.moveTo(pts[i].x,pts[i].y);
          ctx.lineTo(pts[j].x,pts[j].y);
          ctx.stroke();
        }
      }
    }
    pts.forEach(p=>{
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle='rgba(244,161,58,0.38)';
      ctx.fill();
    });
    requestAnimationFrame(frame);
  }
  frame();
})();

/* ═══════════════════════════════
   CLOCK — Egypt time via Intl API
   No server needed. Intl is built
   into every modern browser.
═══════════════════════════════ */
const TZ='Africa/Cairo';
const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DY=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DYL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function pad(n){return String(n).padStart(2,'0')}

function egyptParts(){
  // Use Intl to get the current time broken into parts in Egypt timezone
  const parts=new Intl.DateTimeFormat('en-US',{
    timeZone:TZ,
    hour:'numeric',minute:'numeric',second:'numeric',
    hour12:false,
    year:'numeric',month:'numeric',day:'numeric',weekday:'short'
  }).formatToParts(new Date());
  const get=t=>parts.find(p=>p.type===t)?.value;
  return{
    Y:+get('year'), Mo:+get('month')-1, D:+get('day'),
    h:+get('hour'), m:+get('minute'), s:+get('second'),
    wd:get('weekday')
  };
}

function fmt12(h,m,s){
  const ampm=h>=12?'PM':'AM';
  const h12=h%12||12;
  return `${h12}:${pad(m)}:${pad(s)} ${ampm}`;
}

function tick(){
  const p=egyptParts();
  document.getElementById('clk-d').textContent=
    `${DYL[new Date(p.Y,p.Mo,p.D).getDay()]}, ${p.D} ${MO[p.Mo]} ${p.Y} · Cairo`;
  document.getElementById('clk-t').textContent=fmt12(p.h,p.m,p.s);
}
tick();
setInterval(tick,1000);

/* ═══════════════════════════════
   EGYPT "NOW" for countdowns
   Returns a UTC ms value for the
   current Egypt local time
═══════════════════════════════ */
function egyptNowMs(){
  // Convert current UTC to Egypt local epoch
  const p=egyptParts();
  return new Date(p.Y,p.Mo,p.D,p.h,p.m,p.s).getTime();
}

/* ═══════════════════════════════
   EXAM TIME → Egypt local epoch
   All times in the data are
   already Egypt local clock times
═══════════════════════════════ */
function examEpoch(dt,t){
  const[yr,mo,dy]=dt,[h,m]=t.split(':').map(Number);
  return new Date(yr,mo,dy,h,m,0).getTime();
}

/* ═══════════════════════════════
   EXAM DATA (6 subjects)
   Times = Egypt local (matches the
   school's confirmed start-time table)
   CIE AM=11:00, CIE PM=15:00
   Edexcel AM=11:00, OxAQA AM=10:00
═══════════════════════════════ */
const EXAMS=[
  // CHEMISTRY
  {dt:[2026,3,28],t:'15:00',s:'Chemistry',tag:'che',cls:'c-che',pip:'p-che',
   paper:'Theory – Core (P31) / Extended (P41)',code:'CIE 0620/31 · 0620/41',dur:'1h 15m'},
  {dt:[2026,4,7], t:'15:00',s:'Chemistry',tag:'che',cls:'c-che',pip:'p-che',
   paper:'Alternative to Practical',code:'CIE 0620/61',dur:'1h'},
  {dt:[2026,5,9], t:'15:00',s:'Chemistry',tag:'che',cls:'c-che',pip:'p-che',
   paper:'Multiple Choice – Core / Extended',code:'CIE 0620/11 · 0620/21',dur:'45m'},

  // BIOLOGY
  {dt:[2026,3,30],t:'15:00',s:'Biology',tag:'bio',cls:'c-bio',pip:'p-bio',
   paper:'Theory – Core (P31) / Extended (P41)',code:'CIE 0610/31 · 0610/41',dur:'1h 15m'},
  {dt:[2026,4,12],t:'15:00',s:'Biology',tag:'bio',cls:'c-bio',pip:'p-bio',
   paper:'Alternative to Practical',code:'CIE 0610/61',dur:'1h'},
  {dt:[2026,5,8], t:'15:00',s:'Biology',tag:'bio',cls:'c-bio',pip:'p-bio',
   paper:'Multiple Choice – Core / Extended',code:'CIE 0610/11 · 0610/21',dur:'45m'},

  // PHYSICS
  {dt:[2026,4,8], t:'15:00',s:'Physics',tag:'phy',cls:'c-phy',pip:'p-phy',
   paper:'Theory – Core (P31) / Extended (P41)',code:'CIE 0625/31 · 0625/41',dur:'1h 15m'},
  {dt:[2026,4,19],t:'15:00',s:'Physics',tag:'phy',cls:'c-phy',pip:'p-phy',
   paper:'Alternative to Practical',code:'CIE 0625/61',dur:'1h'},
  {dt:[2026,5,3], t:'15:00',s:'Physics',tag:'phy',cls:'c-phy',pip:'p-phy',
   paper:'Multiple Choice – Core / Extended',code:'CIE 0625/11 · 0625/21',dur:'45m'},

  // MATHEMATICS
  {dt:[2026,4,14],t:'11:00',s:'Mathematics',tag:'mat',cls:'c-mat',pip:'p-mat',
   paper:'Unit 1H – Higher Tier · Calculator',code:'Edexcel 4WM1H/01',dur:'2h'},
  {dt:[2026,5,3], t:'11:00',s:'Mathematics',tag:'mat',cls:'c-mat',pip:'p-mat',
   paper:'Unit 2H – Higher Tier · Calculator',code:'Edexcel 4WM2H/01',dur:'2h'},

  // ENGLISH ESL
  {dt:[2026,3,29],t:'10:00',s:'English ESL',tag:'esl',cls:'c-esl',pip:'p-esl',
   paper:'Listening (9280/L) + Reading (9280/R)',code:'OxAQA 9280',dur:'45m + 1h 15m'},
  {dt:[2026,4,6], t:'15:00',s:'English ESL',tag:'esl',cls:'c-esl',pip:'p-esl',
   paper:'Reading & Writing',code:'CIE 0510/11 · 0511/11',dur:'2h'},
  {dt:[2026,4,11],t:'10:00',s:'English ESL',tag:'esl',cls:'c-esl',pip:'p-esl',
   paper:'Writing',code:'OxAQA 9280/W',dur:'1h 15m'},
  {dt:[2026,4,21],t:'15:00',s:'English ESL',tag:'esl',cls:'c-esl',pip:'p-esl',
   paper:'Listening',code:'CIE 0510/21 · 0511/21',dur:'50m'},
];

// pre-compute
EXAMS.forEach(e=>{
  e.ep=examEpoch(e.dt,e.t);
  e.dn=e.dt[2];
  e.ms=MO[e.dt[1]];
  e.ws=DY[new Date(e.dt[0],e.dt[1],e.dt[2]).getDay()];
  const[h,m]=e.t.split(':').map(Number);
  const ampm=h>=12?'PM':'AM';
  e.t12=`${h%12||12}:${pad(m)} ${ampm}`;
});
EXAMS.sort((a,b)=>a.ep-b.ep);

/* countdown using Egypt local time comparison */
function countdown(examEp){
  const now=egyptNowMs();
  const diff=examEp-now;
  if(diff<=0)return{lbl:'Done',cls:'cdone'};
  const d=Math.floor(diff/86400000);
  const h=Math.floor((diff%86400000)/3600000);
  if(d===0&&h<1)return{lbl:'Starting soon!',cls:'today'};
  if(d===0)return{lbl:`In ${h}h`,cls:'today'};
  if(d===1)return{lbl:'Tomorrow',cls:'soon'};
  if(d<=7)return{lbl:`In ${d} days`,cls:'soon'};
  return{lbl:`In ${d} days`,cls:'future'};
}

/* ═══════════════════════════════
   RENDER
═══════════════════════════════ */
let activeTab='upcoming',activeF='all';

function render(){
  const now=egyptNowMs();
  const list=document.getElementById('list');
  list.innerHTML='';

  const all=EXAMS.filter(e=>activeF==='all'||e.tag===activeF);
  const up=all.filter(e=>e.ep>now);
  const dn=all.filter(e=>e.ep<=now).reverse();

  document.getElementById('uc').textContent=EXAMS.filter(e=>e.ep>now).length;
  document.getElementById('dc').textContent=EXAMS.filter(e=>e.ep<=now).length;

  const show=activeTab==='upcoming'?up:dn;

  if(!show.length){
    list.innerHTML='<div class="empty">No exams in this selection.</div>';
    return;
  }

  show.forEach((e,i)=>{
    const cd=countdown(e.ep);
    const isDone=e.ep<=now;
    const card=document.createElement('div');
    card.className=`card ${e.cls}${isDone?' done':''}`;
    card.style.animationDelay=`${i*38}ms`;
    card.innerHTML=
      `<div class="db">
        <div class="dday">${e.dn}</div>
        <div class="dmo">${e.ms}</div>
        <div class="dwk">${e.ws}</div>
       </div>
       <div class="dvd"></div>
       <div class="di">
        <div class="dsubj">${e.s}</div>
        <div class="dpap">${e.paper}</div>
        <div class="dcode">${e.code}</div>
       </div>
       <div class="dr">
        <span class="badge">${e.t12}</span>
        <span class="pip ${e.pip}">${e.dur}</span>
        <span class="cdwn ${cd.cls}">${cd.lbl}</span>
       </div>`;
    list.appendChild(card);
  });

  if(activeF==='all'||activeF==='esl'){
    const n=document.createElement('div');
    n.className='note';
    n.innerHTML=
      '<strong>Speaking windows</strong><br>'+
      'CIE ESL Speaking (0510/31): 30 Mar – 27 Apr 2026 · arranged by your centre<br>'+
      'OxAQA ESL Speaking (9280): 27 Mar – 1 May 2026 · submit by 4 May 2026';
    list.appendChild(n);
  }
}

document.getElementById('tabs').addEventListener('click',e=>{
  const b=e.target.closest('.tab');if(!b)return;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');activeTab=b.dataset.tab;render();
});
document.getElementById('fbar').addEventListener('click',e=>{
  const b=e.target.closest('.fb');if(!b)return;
  document.querySelectorAll('.fb').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');activeF=b.dataset.f;render();
});

render();
setInterval(render,30000);
</script>
</body>
</html>
