<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Egypt IGCSE 2026 — Exam Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #09090f;
  --surface: #111118;
  --surface2: #18181f;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text: #f0f0f5;
  --muted: #666678;
  --muted2: #9090a0;
  --accent: #f4a13a;
  --phy: #3b9eff;
  --bio: #3ecf8e;
  --che: #a78bfa;
  --mat: #f4a13a;
  --esl: #f472b6;
  --done-bg: #0d0d0d;
  --done-text: #44444f;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── BACKGROUND ── */
body::before {
  content: '';
  position: fixed;
  top: -200px; left: 50%;
  transform: translateX(-50%);
  width: 800px; height: 500px;
  background: radial-gradient(ellipse, rgba(244,161,58,0.07) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* ── HEADER ── */
header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(9,9,15,0.85);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 clamp(16px, 4vw, 48px);
}

.header-inner {
  max-width: 900px; margin: 0 auto;
  display: flex; align-items: center;
  justify-content: space-between;
  height: 64px; gap: 12px;
}

.logo {
  font-family: 'Syne', sans-serif;
  font-size: 15px; font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--text);
  white-space: nowrap;
}
.logo span { color: var(--accent); }

#clock-display {
  font-family: 'DM Mono', monospace;
  font-size: clamp(11px, 2vw, 14px);
  color: var(--muted2);
  text-align: right;
  line-height: 1.5;
}
#clock-time {
  font-size: clamp(16px, 3.5vw, 22px);
  font-weight: 500;
  color: var(--text);
  display: block;
}

/* ── MAIN ── */
main {
  max-width: 900px; margin: 0 auto;
  padding: clamp(16px, 4vw, 48px);
  position: relative; z-index: 1;
}

/* ── NAV TABS ── */
.nav-tabs {
  display: flex; gap: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 4px;
  width: fit-content;
  margin-bottom: 28px;
}

.nav-tab {
  padding: 8px 22px;
  border-radius: 8px;
  border: none;
  background: transparent;
  color: var(--muted2);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px; font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  display: flex; align-items: center; gap: 7px;
}
.nav-tab .count {
  font-size: 11px;
  background: rgba(255,255,255,0.08);
  border-radius: 99px;
  padding: 1px 7px;
  font-weight: 500;
}
.nav-tab.active {
  background: var(--accent);
  color: #09090f;
}
.nav-tab.active .count {
  background: rgba(0,0,0,0.2);
  color: #09090f;
}
.nav-tab:hover:not(.active) {
  background: var(--surface2);
  color: var(--text);
}

/* ── SUBJECT FILTERS ── */
.filters {
  display: flex; flex-wrap: wrap; gap: 8px;
  margin-bottom: 32px;
}

.filter-btn {
  padding: 6px 16px;
  border-radius: 99px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted2);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px; font-weight: 400;
  cursor: pointer;
  transition: all 0.2s;
  display: flex; align-items: center; gap: 6px;
}
.filter-btn .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  display: inline-block;
}
.filter-btn:hover { border-color: var(--border2); color: var(--text); }
.filter-btn.active {
  border-color: transparent;
  color: #09090f;
  font-weight: 500;
}
.filter-btn[data-f="all"].active { background: var(--text); }
.filter-btn[data-f="phy"].active { background: var(--phy); }
.filter-btn[data-f="bio"].active { background: var(--bio); }
.filter-btn[data-f="che"].active { background: var(--che); }
.filter-btn[data-f="mat"].active { background: var(--mat); }
.filter-btn[data-f="esl"].active { background: var(--esl); }

/* ── CARDS ── */
.exam-list { display: flex; flex-direction: column; gap: 10px; }

.exam-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  transition: border-color 0.2s, transform 0.2s;
  opacity: 0;
  transform: translateY(20px);
  animation: slideIn 0.45s forwards;
  cursor: default;
  position: relative;
  overflow: hidden;
}
.exam-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  border-radius: 3px 0 0 3px;
}
.exam-card.phy::before { background: var(--phy); }
.exam-card.bio::before { background: var(--bio); }
.exam-card.che::before { background: var(--che); }
.exam-card.mat::before { background: var(--mat); }
.exam-card.esl::before { background: var(--esl); }

.exam-card:hover {
  border-color: var(--border2);
  transform: translateY(-1px);
}

.exam-card.done {
  background: var(--done-bg);
  border-color: rgba(255,255,255,0.04);
  opacity: 0;
  animation: slideIn 0.45s forwards;
}
.exam-card.done .exam-subj,
.exam-card.done .exam-detail,
.exam-card.done .exam-code { color: var(--done-text) !important; }
.exam-card.done::before { opacity: 0.25; }
.exam-card.done .date-day,
.exam-card.done .date-label { color: var(--done-text) !important; }
.exam-card.done .badge { opacity: 0.35; }
.exam-card.done .countdown { color: var(--done-text) !important; }

@keyframes slideIn {
  to { opacity: 1; transform: translateY(0); }
}

/* date */
.date-block {
  flex-shrink: 0;
  width: 48px;
  text-align: center;
}
.date-day {
  font-family: 'Syne', sans-serif;
  font-size: 24px; font-weight: 700;
  line-height: 1;
  color: var(--text);
}
.date-label {
  font-size: 11px; font-weight: 400;
  color: var(--muted);
  margin-top: 2px;
  letter-spacing: 0.03em;
}

/* divider */
.vdiv {
  width: 1px; align-self: stretch;
  background: var(--border);
  flex-shrink: 0;
}

/* info */
.exam-info { flex: 1; min-width: 0; }
.exam-subj {
  font-family: 'Syne', sans-serif;
  font-size: 15px; font-weight: 600;
  color: var(--text);
  margin-bottom: 3px;
}
.exam-detail {
  font-size: 12px; color: var(--muted2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.exam-code {
  font-family: 'DM Mono', monospace;
  font-size: 11px; color: var(--muted);
  margin-top: 2px;
}

/* badges / right side */
.exam-right {
  display: flex; flex-direction: column;
  align-items: flex-end; gap: 6px;
  flex-shrink: 0;
}
.time-badge {
  font-family: 'DM Mono', monospace;
  font-size: 13px; font-weight: 500;
  color: var(--text);
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 3px 10px;
}
.dur-badge {
  font-size: 11px; color: var(--muted);
  background: transparent;
}
.countdown {
  font-size: 11px; font-weight: 500;
  white-space: nowrap;
}
.countdown.today { color: #f87171; }
.countdown.soon { color: var(--accent); }
.countdown.future { color: var(--muted2); }
.countdown.done-label { color: var(--done-text); }

/* subject badge */
.subj-pip {
  font-size: 11px; font-weight: 500;
  padding: 2px 9px; border-radius: 99px;
  letter-spacing: 0.03em;
}
.pip-phy { background: rgba(59,158,255,0.12); color: var(--phy); }
.pip-bio { background: rgba(62,207,142,0.12); color: var(--bio); }
.pip-che { background: rgba(167,139,250,0.12); color: var(--che); }
.pip-mat { background: rgba(244,161,58,0.12); color: var(--mat); }
.pip-esl { background: rgba(244,114,182,0.12); color: var(--esl); }

/* empty state */
.empty {
  text-align: center; padding: 64px 0;
  color: var(--muted); font-size: 14px;
}
.empty-icon { font-size: 40px; margin-bottom: 12px; }

/* section label */
.section-label {
  font-size: 11px; font-weight: 500; letter-spacing: 0.08em;
  color: var(--muted); text-transform: uppercase;
  margin-bottom: 12px; padding-left: 2px;
}

/* ── RESPONSIVE ── */
@media (max-width: 520px) {
  .exam-card { padding: 14px 14px; gap: 12px; }
  .exam-subj { font-size: 14px; }
  .exam-right { display: none; }
  .date-day { font-size: 20px; }
  .nav-tabs { width: 100%; }
  .nav-tab { flex: 1; justify-content: center; }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">Egypt IGCSE <span>2026</span></div>
    <div id="clock-display">
      <span id="clock-date"></span>
      <span id="clock-time"></span>
    </div>
  </div>
</header>

<main>
  <div class="nav-tabs">
    <button class="nav-tab active" data-tab="upcoming">
      Upcoming <span class="count" id="upcoming-count">0</span>
    </button>
    <button class="nav-tab" data-tab="done">
      Done <span class="count" id="done-count">0</span>
    </button>
  </div>

  <div class="filters" id="filters">
    <button class="filter-btn active" data-f="all"><span class="dot" style="background:#888"></span>All subjects</button>
    <button class="filter-btn" data-f="phy"><span class="dot" style="background:var(--phy)"></span>Physics</button>
    <button class="filter-btn" data-f="bio"><span class="dot" style="background:var(--bio)"></span>Biology</button>
    <button class="filter-btn" data-f="che"><span class="dot" style="background:var(--che)"></span>Chemistry</button>
    <button class="filter-btn" data-f="mat"><span class="dot" style="background:var(--mat)"></span>Maths</button>
    <button class="filter-btn" data-f="esl"><span class="dot" style="background:var(--esl)"></span>English ESL</button>
  </div>

  <div id="exam-list" class="exam-list"></div>
</main>

<script>
// ── EXAM DATA ──
// Dates: year, month (0-indexed), day, hour, minute
const exams = [
  { date: [2026,3,28], time:"15:00", board:"CIE", subj:"Chemistry", tag:"che", paper:"Theory – Core (P31) / Extended (P41)", code:"0620/31 · 0620/41", dur:"1h 15m" },
  { date: [2026,3,29], time:"10:00", board:"OxAQA", subj:"English ESL", tag:"esl", paper:"Listening (9280/L) + Reading (9280/R)", code:"OxAQA 9280", dur:"45m + 1h 15m" },
  { date: [2026,3,30], time:"15:00", board:"CIE", subj:"Biology", tag:"bio", paper:"Theory – Core (P31) / Extended (P41)", code:"0610/31 · 0610/41", dur:"1h 15m" },
  { date: [2026,4,6],  time:"15:00", board:"CIE", subj:"English ESL", tag:"esl", paper:"Reading & Writing", code:"0510/11 · 0510/12", dur:"2h" },
  { date: [2026,4,7],  time:"15:00", board:"CIE", subj:"Chemistry", tag:"che", paper:"Alternative to Practical", code:"0620/61", dur:"1h" },
  { date: [2026,4,8],  time:"15:00", board:"CIE", subj:"Physics", tag:"phy", paper:"Theory – Core (P31) / Extended (P41)", code:"0625/31 · 0625/41", dur:"1h 15m" },
  { date: [2026,4,11], time:"10:00", board:"OxAQA", subj:"English ESL", tag:"esl", paper:"Writing", code:"OxAQA 9280/W", dur:"1h 15m" },
  { date: [2026,4,12], time:"15:00", board:"CIE", subj:"Biology", tag:"bio", paper:"Alternative to Practical", code:"0610/61", dur:"1h" },
  { date: [2026,4,14], time:"11:00", board:"Edexcel", subj:"Mathematics", tag:"mat", paper:"Unit 1H – Higher Tier · Calculator", code:"4WM1H/01", dur:"2h" },
  { date: [2026,4,19], time:"15:00", board:"CIE", subj:"Physics", tag:"phy", paper:"Alternative to Practical", code:"0625/61", dur:"1h" },
  { date: [2026,4,21], time:"15:00", board:"CIE", subj:"English ESL", tag:"esl", paper:"Listening", code:"0510/21 · 0510/22", dur:"50m" },
  { date: [2026,5,3],  time:"11:00", board:"Edexcel", subj:"Mathematics", tag:"mat", paper:"Unit 2H – Higher Tier · Calculator", code:"4WM2H/01", dur:"2h" },
  { date: [2026,5,3],  time:"15:00", board:"CIE", subj:"Physics", tag:"phy", paper:"Multiple Choice – Core (P11) / Extended (P21)", code:"0625/11 · 0625/21", dur:"45m" },
  { date: [2026,5,8],  time:"15:00", board:"CIE", subj:"Biology", tag:"bio", paper:"Multiple Choice – Core (P11) / Extended (P21)", code:"0610/11 · 0610/21", dur:"45m" },
  { date: [2026,5,9],  time:"15:00", board:"CIE", subj:"Chemistry", tag:"che", paper:"Multiple Choice – Core (P11) / Extended (P21)", code:"0620/11 · 0620/21", dur:"45m" },
];

const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTH_FULL = ["January","February","March","April","May","June","July","August","September","October","November","December"];

// build Date objects
exams.forEach(e => {
  const [h, m] = e.time.split(':').map(Number);
  e.dateObj = new Date(e.date[0], e.date[1], e.date[2], h, m, 0);
  e.day = e.date[2];
  e.monthShort = MONTHS[e.date[1]];
  e.dayShort = DAYS[new Date(e.date[0], e.date[1], e.date[2]).getDay()];
});

// ── CLOCK ──
function pad(n){ return String(n).padStart(2,'0'); }
function updateClock(){
  const now = new Date();
  document.getElementById('clock-date').textContent =
    `${DAYS[now.getDay()]}, ${now.getDate()} ${MONTHS[now.getMonth()]} ${now.getFullYear()}`;
  document.getElementById('clock-time').textContent =
    `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
}
updateClock();
setInterval(updateClock, 1000);

// ── STATE ──
let activeTab = 'upcoming';
let activeFilter = 'all';

// ── COUNTDOWN ──
function getCountdown(examDate){
  const now = new Date();
  const diff = examDate - now;
  if(diff < 0) return { label:'Done', cls:'done-label' };
  const days = Math.floor(diff / 86400000);
  const hrs = Math.floor((diff % 86400000) / 3600000);
  if(days === 0 && hrs < 1) return { label:'Starting now!', cls:'today' };
  if(days === 0) return { label:`In ${hrs}h`, cls:'today' };
  if(days === 1) return { label:'Tomorrow', cls:'soon' };
  if(days <= 7) return { label:`In ${days} days`, cls:'soon' };
  return { label:`In ${days} days`, cls:'future' };
}

// ── RENDER ──
function render(){
  const now = new Date();
  const list = document.getElementById('exam-list');
  list.innerHTML = '';

  const filtered = exams.filter(e => activeFilter === 'all' || e.tag === activeFilter);
  const upcoming = filtered.filter(e => e.dateObj >= now);
  const done = filtered.filter(e => e.dateObj < now);

  // update counts (always all-filter for counts)
  const allUpcoming = exams.filter(e => activeFilter === 'all' ? e.dateObj >= now : (e.tag === activeFilter && e.dateObj >= now));
  const allDone = exams.filter(e => activeFilter === 'all' ? e.dateObj < now : (e.tag === activeFilter && e.dateObj < now));
  document.getElementById('upcoming-count').textContent = exams.filter(e => e.dateObj >= now).length;
  document.getElementById('done-count').textContent = exams.filter(e => e.dateObj < now).length;

  const toShow = activeTab === 'upcoming' ? upcoming : done;

  if(toShow.length === 0){
    list.innerHTML = `<div class="empty"><div class="empty-icon">${activeTab==='done'?'✓':'📅'}</div>${activeTab==='done'?'No exams done yet in this subject.':'No upcoming exams in this subject.'}</div>`;
    return;
  }

  toShow.forEach((e, i) => {
    const cd = getCountdown(e.dateObj);
    const isDone = e.dateObj < now;
    const card = document.createElement('div');
    card.className = `exam-card ${e.tag}${isDone ? ' done' : ''}`;
    card.style.animationDelay = `${i * 55}ms`;

    card.innerHTML = `
      <div class="date-block">
        <div class="date-day">${e.day}</div>
        <div class="date-label">${e.monthShort}</div>
        <div class="date-label">${e.dayShort}</div>
      </div>
      <div class="vdiv"></div>
      <div class="exam-info">
        <div class="exam-subj">${e.subj}</div>
        <div class="exam-detail">${e.paper}</div>
        <div class="exam-code">${e.board} · ${e.code}</div>
      </div>
      <div class="exam-right">
        <span class="time-badge">${e.time}</span>
        <span class="subj-pip pip-${e.tag}">${e.dur}</span>
        <span class="countdown ${cd.cls}">${cd.label}</span>
      </div>
    `;
    list.appendChild(card);
  });
}

// ── EVENTS ──
document.querySelectorAll('.nav-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeTab = btn.dataset.tab;
    render();
  });
});

document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if(!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeFilter = btn.dataset.f;
  render();
});

// ── INIT ──
render();
// re-render every minute to keep done/upcoming split accurate
setInterval(render, 60000);
</script>
</body>
</html>
