<script>
  // Function to convert 24-hour time to 12-hour format with AM/PM
  function convertTo12HourFormat(time) {
      const [hours, minutes] = time.split(':').map(Number);
      const suffix = hours >= 12 ? 'PM' : 'AM';
      const formattedHour = hours % 12 === 0 ? 12 : hours % 12;
      return `${formattedHour}:${minutes.toString().padStart(2, '0')} ${suffix}`;
  }

  // Function to get current Egypt time
  function updateClock() {
      const utcDate = new Date(new Date().toUTCString());
      const options = { timeZone: 'Africa/Cairo', hour: '2-digit', minute: '2-digit', hour12: true };
      const timeString = utcDate.toLocaleString('en-US', options);
      document.getElementById('clock').innerText = `Egypt Time: ${timeString}`;
  }

  // Example function to update exam times
  function updateExamTimes() {
      const examElements = document.querySelectorAll('.exam-time'); // Assuming .exam-time is a class for the times
      examElements.forEach((element) => {
          const originalTime = element.innerText; // Get the text content
          element.innerText = convertTo12HourFormat(originalTime); // Update the text
      });
  }

  // Call the functions on page load
  document.addEventListener('DOMContentLoaded', () => {
      updateClock();
      updateExamTimes();
  });
</script>
