<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Egypt IGCSE 2026 — Exam Schedule</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09090f;--sur:#111118;--sur2:#16161e;
  --brd:rgba(255,255,255,.06);--brd2:rgba(255,255,255,.13);
  --txt:#eeeef2;--mut:#50505f;--mut2:#888899;--acc:#f4a13a;
  --phy:#3b9eff;--bio:#3ecf8e;--che:#a78bfa;--mat:#f4a13a;--esl:#f472b6;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden}

/* ── PARTICLE CANVAS ── */
#cvs{position:fixed;inset:0;z-index:0;pointer-events:none}

/* ── HEADER ── */
header{
  position:sticky;top:0;z-index:200;
  background:rgba(9,9,15,.88);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  border-bottom:1px solid var(--brd);
}
.hdr{
  max-width:960px;margin:0 auto;
  padding:0 clamp(14px,3vw,40px);
  height:62px;display:flex;align-items:center;
  justify-content:space-between;gap:16px;
}
.logo{
  font-family:'Syne',sans-serif;font-size:14px;
  font-weight:700;letter-spacing:.05em;white-space:nowrap;
}
.logo span{color:var(--acc)}

.clock-block{text-align:right;line-height:1.5}
#clk-d{
  font-family:'DM Mono',monospace;
  font-size:11px;color:var(--mut2);
  display:block;
}
#clk-t{
  font-family:'DM Mono',monospace;
  font-size:clamp(15px,2.5vw,20px);
  font-weight:500;color:var(--txt);
  display:block;
}

/* ── MAIN ── */
main{
  max-width:960px;margin:0 auto;
  padding:clamp(14px,3vw,36px);
  position:relative;z-index:1;
}

/* ── TABS ── */
.tabs{
  display:flex;gap:4px;background:var(--sur);
  border:1px solid var(--brd);border-radius:10px;
  padding:3px;width:fit-content;margin-bottom:18px;
}
.tab{
  padding:7px 22px;border-radius:7px;border:none;
  background:transparent;color:var(--mut2);
  font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;
  cursor:pointer;transition:all .2s;
  display:flex;align-items:center;gap:6px;
}
.tab .cnt{
  font-size:11px;background:rgba(255,255,255,.08);
  border-radius:99px;padding:1px 7px;
}
.tab.active{background:var(--acc);color:#09090f}
.tab.active .cnt{background:rgba(0,0,0,.18);color:#09090f}
.tab:hover:not(.active){background:var(--sur2);color:var(--txt)}

/* ── FILTER BAR ── */
.fbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:24px;align-items:center}
.fcat{font-size:11px;font-weight:600;color:var(--mut);letter-spacing:.07em;text-transform:uppercase;margin-right:2px}
.fb{
  padding:5px 14px;border-radius:99px;
  border:1px solid var(--brd);background:transparent;
  color:var(--mut2);font-family:'DM Sans',sans-serif;
  font-size:12px;cursor:pointer;transition:all .2s;
  display:flex;align-items:center;gap:5px;white-space:nowrap;
}
.fb .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.fb:hover{border-color:var(--brd2);color:var(--txt)}
.fb.active{border-color:transparent;color:#09090f;font-weight:500}
.fb[data-f="all"].active{background:var(--txt)}
.fb[data-f="phy"].active{background:var(--phy)}
.fb[data-f="bio"].active{background:var(--bio)}
.fb[data-f="che"].active{background:var(--che)}
.fb[data-f="mat"].active{background:var(--mat)}
.fb[data-f="esl"].active{background:var(--esl)}

/* ── CARDS ── */
#list{display:flex;flex-direction:column;gap:7px}

.card{
  background:var(--sur);border:1px solid var(--brd);
  border-radius:13px;padding:15px 17px;
  display:flex;align-items:center;gap:14px;
  position:relative;overflow:hidden;cursor:default;
  opacity:0;transform:translateY(16px);
  animation:slideIn .4s forwards;
  transition:border-color .2s,transform .2s;
}
.card:hover{border-color:var(--brd2);transform:translateY(-1px)}
@keyframes slideIn{to{opacity:1;transform:translateY(0)}}

/* left color strip */
.card::before{
  content:'';position:absolute;
  left:0;top:0;bottom:0;width:3px;
  border-radius:3px 0 0 3px;
}
.c-phy::before{background:var(--phy)}
.c-bio::before{background:var(--bio)}
.c-che::before{background:var(--che)}
.c-mat::before{background:var(--mat)}
.c-esl::before{background:var(--esl)}

/* done state */
.done{background:rgba(14,14,20,.6);border-color:rgba(255,255,255,.03)}
.done::before{opacity:.2}
.done .dday,.done .dmo,.done .dsubj,.done .dpap,.done .dcode{color:#2b2b38!important}
.done .badge,.done .pip,.done .cdwn{opacity:.2}
.done:hover{transform:none}

/* date block */
.db{min-width:46px;text-align:center;flex-shrink:0}
.dday{font-family:'Syne',sans-serif;font-size:23px;font-weight:700;line-height:1;color:var(--txt)}
.dmo{font-size:10px;color:var(--mut);margin-top:1px;letter-spacing:.02em}
.dwk{font-size:10px;color:var(--mut);margin-top:1px}

/* divider */
.dvd{width:1px;align-self:stretch;background:var(--brd);flex-shrink:0}

/* info */
.di{flex:1;min-width:0}
.dsubj{font-family:'Syne',sans-serif;font-size:14px;font-weight:600;color:var(--txt);margin-bottom:2px}
.dpap{font-size:11px;color:var(--mut2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcode{font-family:'DM Mono',monospace;font-size:10px;color:var(--mut);margin-top:2px}

/* right meta */
.dr{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.badge{
  font-family:'DM Mono',monospace;font-size:12px;font-weight:500;
  color:var(--txt);background:var(--sur2);
  border:1px solid var(--brd);border-radius:7px;
  padding:3px 9px;white-space:nowrap;
}
.pip{font-size:10px;padding:2px 8px;border-radius:99px;font-weight:500;white-space:nowrap}
.p-phy{background:rgba(59,158,255,.12);color:var(--phy)}
.p-bio{background:rgba(62,207,142,.12);color:var(--bio)}
.p-che{background:rgba(167,139,250,.12);color:var(--che)}
.p-mat{background:rgba(244,161,58,.12);color:var(--mat)}
.p-esl{background:rgba(244,114,182,.12);color:var(--esl)}

.cdwn{font-size:10px;font-weight:500;white-space:nowrap}
.today{color:#f87171}.soon{color:var(--acc)}.future{color:var(--mut2)}.cdone{color:#2b2b38}

/* speaking window note */
.note{
  font-size:11px;color:var(--mut2);
  background:var(--sur);border:1px solid var(--brd);
  border-radius:10px;padding:.65rem 1rem;
  margin-top:6px;line-height:1.7;
}
.note strong{color:var(--mut2)}

.empty{text-align:center;padding:56px 0;color:var(--mut);font-size:13px}

@media(max-width:500px){
  .dr{display:none}
  .card{padding:12px 13px}
  .dday{font-size:19px}
  .tabs{width:100%}
  .tab{flex:1;justify-content:center;padding:7px 8px;font-size:12px}
}
</style>
</head>
<body>

<!-- particle canvas -->
<canvas id="cvs"></canvas>

<header>
  <div class="hdr">
    <div class="logo">Egypt IGCSE <span>2026</span></div>
    <div class="clock-block">
      <span id="clk-d"></span>
      <span id="clk-t"></span>
    </div>
  </div>
</header>

<main>
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="upcoming">Upcoming <span class="cnt" id="uc">0</span></button>
    <button class="tab" data-tab="done">Done <span class="cnt" id="dc">0</span></button>
  </div>

  <div class="fbar" id="fbar">
    <span class="fcat">Filter</span>
    <button class="fb active" data-f="all"><span class="dot" style="background:#777"></span>All subjects</button>
    <button class="fb" data-f="phy"><span class="dot" style="background:var(--phy)"></span>Physics</button>
    <button class="fb" data-f="bio"><span class="dot" style="background:var(--bio)"></span>Biology</button>
    <button class="fb" data-f="che"><span class="dot" style="background:var(--che)"></span>Chemistry</button>
    <button class="fb" data-f="mat"><span class="dot" style="background:var(--mat)"></span>Maths</button>
    <button class="fb" data-f="esl"><span class="dot" style="background:var(--esl)"></span>English ESL</button>
  </div>

  <div id="list"></div>
</main>

<script>
/* ════════════════════════════════════════
   PARTICLES
════════════════════════════════════════ */
(function(){
  const cvs = document.getElementById('cvs');
  const ctx = cvs.getContext('2d');
  let W, H, particles = [];
  const COUNT = 80;
  const MAX_DIST = 130;
  const SPEED = 0.4;

  function resize(){
    W = cvs.width  = window.innerWidth;
    H = cvs.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  function rand(min, max){ return min + Math.random() * (max - min); }

  for(let i = 0; i < COUNT; i++){
    particles.push({
      x: rand(0, window.innerWidth),
      y: rand(0, window.innerHeight),
      vx: rand(-SPEED, SPEED),
      vy: rand(-SPEED, SPEED),
      r: rand(1.2, 2.6)
    });
  }

  function draw(){
    ctx.clearRect(0, 0, W, H);

    // update positions & bounce
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      if(p.x < 0 || p.x > W) p.vx *= -1;
      if(p.y < 0 || p.y > H) p.vy *= -1;
    });

    // draw lines
    for(let i = 0; i < particles.length; i++){
      for(let j = i + 1; j < particles.length; j++){
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if(dist < MAX_DIST){
          const alpha = (1 - dist / MAX_DIST) * 0.18;
          ctx.beginPath();
          ctx.strokeStyle = `rgba(244,161,58,${alpha})`;
          ctx.lineWidth = 0.8;
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.stroke();
        }
      }
    }

    // draw dots
    particles.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(244,161,58,0.35)';
      ctx.fill();
    });

    requestAnimationFrame(draw);
  }
  draw();
})();

/* ════════════════════════════════════════
   CLOCK — Egypt timezone (Africa/Cairo)
════════════════════════════════════════ */
const TZ = 'Africa/Cairo';

function egyptNow(){
  // Returns a Date-like object in Egypt local time using Intl
  return new Date(new Date().toLocaleString('en-US', {timeZone: TZ}));
}

function fmt12(h, m, s){
  const ampm = h >= 12 ? 'PM' : 'AM';
  const h12  = h % 12 || 12;
  return `${h12}:${pad(m)}:${pad(s)} ${ampm}`;
}

function pad(n){ return String(n).padStart(2, '0'); }

const DAYS  = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONS  = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS_S = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function tick(){
  const n = egyptNow();
  document.getElementById('clk-d').textContent =
    `${DAYS[n.getDay()]}, ${n.getDate()} ${MONS[n.getMonth()]} ${n.getFullYear()} · Cairo`;
  document.getElementById('clk-t').textContent =
    fmt12(n.getHours(), n.getMinutes(), n.getSeconds());
}
tick();
setInterval(tick, 1000);

/* ════════════════════════════════════════
   EXAM DATA  (times already in Egypt local)
════════════════════════════════════════ */
// dt:[year, month (0-based), day], t:'HH:MM' Egypt local time
const EXAMS = [
  // ── CHEMISTRY ──
  {dt:[2026,3,28], t:'15:00', s:'Chemistry',    tag:'che', cls:'c-che', pip:'p-che',
   paper:'Theory – Core (P31) / Extended (P41)', code:'CIE 0620/31 · 0620/41', dur:'1h 15m', board:'CIE'},
  {dt:[2026,4,7],  t:'15:00', s:'Chemistry',    tag:'che', cls:'c-che', pip:'p-che',
   paper:'Alternative to Practical',             code:'CIE 0620/61',             dur:'1h',    board:'CIE'},
  {dt:[2026,5,9],  t:'15:00', s:'Chemistry',    tag:'che', cls:'c-che', pip:'p-che',
   paper:'Multiple Choice – Core / Extended',    code:'CIE 0620/11 · 0620/21',   dur:'45m',  board:'CIE'},

  // ── BIOLOGY ──
  {dt:[2026,3,30], t:'15:00', s:'Biology',      tag:'bio', cls:'c-bio', pip:'p-bio',
   paper:'Theory – Core (P31) / Extended (P41)', code:'CIE 0610/31 · 0610/41', dur:'1h 15m', board:'CIE'},
  {dt:[2026,4,12], t:'15:00', s:'Biology',      tag:'bio', cls:'c-bio', pip:'p-bio',
   paper:'Alternative to Practical',             code:'CIE 0610/61',             dur:'1h',    board:'CIE'},
  {dt:[2026,5,8],  t:'15:00', s:'Biology',      tag:'bio', cls:'c-bio', pip:'p-bio',
   paper:'Multiple Choice – Core / Extended',    code:'CIE 0610/11 · 0610/21',   dur:'45m',  board:'CIE'},

  // ── PHYSICS ──
  {dt:[2026,4,8],  t:'15:00', s:'Physics',      tag:'phy', cls:'c-phy', pip:'p-phy',
   paper:'Theory – Core (P31) / Extended (P41)', code:'CIE 0625/31 · 0625/41', dur:'1h 15m', board:'CIE'},
  {dt:[2026,4,19], t:'15:00', s:'Physics',      tag:'phy', cls:'c-phy', pip:'p-phy',
   paper:'Alternative to Practical',             code:'CIE 0625/61',             dur:'1h',    board:'CIE'},
  {dt:[2026,5,3],  t:'15:00', s:'Physics',      tag:'phy', cls:'c-phy', pip:'p-phy',
   paper:'Multiple Choice – Core / Extended',    code:'CIE 0625/11 · 0625/21',   dur:'45m',  board:'CIE'},

  // ── MATHEMATICS ──
  {dt:[2026,4,14], t:'11:00', s:'Mathematics',  tag:'mat', cls:'c-mat', pip:'p-mat',
   paper:'Unit 1H – Higher Tier · Calculator', code:'Edexcel 4WM1H/01', dur:'2h', board:'Edexcel'},
  {dt:[2026,5,3],  t:'11:00', s:'Mathematics',  tag:'mat', cls:'c-mat', pip:'p-mat',
   paper:'Unit 2H – Higher Tier · Calculator', code:'Edexcel 4WM2H/01', dur:'2h', board:'Edexcel'},

  // ── ENGLISH ESL ──
  {dt:[2026,3,29], t:'10:00', s:'English ESL',  tag:'esl', cls:'c-esl', pip:'p-esl',
   paper:'Listening (9280/L) + Reading (9280/R)', code:'OxAQA 9280',   dur:'45m + 1h 15m', board:'OxAQA'},
  {dt:[2026,4,6],  t:'15:00', s:'English ESL',  tag:'esl', cls:'c-esl', pip:'p-esl',
   paper:'Reading & Writing',                   code:'CIE 0510/11 · 0511/11',   dur:'2h',   board:'CIE'},
  {dt:[2026,4,11], t:'10:00', s:'English ESL',  tag:'esl', cls:'c-esl', pip:'p-esl',
   paper:'Writing',                              code:'OxAQA 9280/W',            dur:'1h 15m', board:'OxAQA'},
  {dt:[2026,4,21], t:'15:00', s:'English ESL',  tag:'esl', cls:'c-esl', pip:'p-esl',
   paper:'Listening',                            code:'CIE 0510/21 · 0511/21',   dur:'50m',  board:'CIE'},
];

// Attach real Date objects (Egypt local → UTC offset trick via Intl)
function toEgyptDate(dt, t){
  const [h, m] = t.split(':').map(Number);
  // Build a UTC date that corresponds to the Egypt local time
  // Egypt is UTC+2 (EET), UTC+3 (EEST in summer — from last Fri of Apr)
  // May/June is EEST (+3), April is a mix; April exams before last Friday April = EET +2
  // Last Friday April 2026 = April 24.  So Apr 24 onwards = EEST.
  const [y, mo, dy] = dt;
  // Rough offset: before Apr 24 = UTC+2, from Apr 24 = UTC+3
  const lastFriApr = 24;
  let offset = 2;
  if(mo > 3) offset = 3; // May, June
  else if(mo === 3 && dy >= lastFriApr) offset = 3;
  return new Date(Date.UTC(y, mo, dy, h - offset, m, 0));
}

EXAMS.forEach(e => {
  e.dateUTC = toEgyptDate(e.dt, e.t);
  e.dayN  = e.dt[2];
  e.monS  = MONS[e.dt[1]];
  e.wkS   = DAYS_S[new Date(e.dt[0], e.dt[1], e.dt[2]).getDay()];
  // 12h display
  const [h, m] = e.t.split(':').map(Number);
  e.t12 = fmt12(h, m, 0).replace(':00 ', ' ');  // "3:00 PM"
});

EXAMS.sort((a, b) => a.dateUTC - b.dateUTC);

/* ════════════════════════════════════════
   COUNTDOWN  (uses Egypt local time)
════════════════════════════════════════ */
function countdown(examUTC){
  const nowUTC = new Date();
  const diff   = examUTC - nowUTC;
  if(diff < 0) return {lbl:'Done', cls:'cdone'};
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  if(d === 0 && h < 1) return {lbl:'Starting soon!', cls:'today'};
  if(d === 0)          return {lbl:`In ${h}h`,        cls:'today'};
  if(d === 1)          return {lbl:'Tomorrow',         cls:'soon'};
  if(d <= 7)           return {lbl:`In ${d} days`,    cls:'soon'};
  return                     {lbl:`In ${d} days`,     cls:'future'};
}

/* ════════════════════════════════════════
   RENDER
════════════════════════════════════════ */
let activeTab = 'upcoming', activeF = 'all';

function render(){
  const nowUTC = new Date();
  const list   = document.getElementById('list');
  list.innerHTML = '';

  const all  = EXAMS.filter(e => activeF === 'all' || e.tag === activeF);
  const up   = all.filter(e => e.dateUTC >= nowUTC);
  const done = all.filter(e => e.dateUTC <  nowUTC).reverse();

  document.getElementById('uc').textContent = EXAMS.filter(e => e.dateUTC >= nowUTC).length;
  document.getElementById('dc').textContent = EXAMS.filter(e => e.dateUTC <  nowUTC).length;

  const show = activeTab === 'upcoming' ? up : done;

  if(!show.length){
    list.innerHTML = '<div class="empty">No exams in this selection.</div>';
    return;
  }

  show.forEach((e, i) => {
    const cd     = countdown(e.dateUTC);
    const isDone = e.dateUTC < nowUTC;
    const card   = document.createElement('div');
    card.className = `card ${e.cls}${isDone ? ' done' : ''}`;
    card.style.animationDelay = `${i * 40}ms`;
    card.innerHTML =
      `<div class="db">
         <div class="dday">${e.dayN}</div>
         <div class="dmo">${e.monS}</div>
         <div class="dwk">${e.wkS}</div>
       </div>
       <div class="dvd"></div>
       <div class="di">
         <div class="dsubj">${e.s}</div>
         <div class="dpap">${e.paper}</div>
         <div class="dcode">${e.board} · ${e.code}</div>
       </div>
       <div class="dr">
         <span class="badge">${e.t12}</span>
         <span class="pip ${e.pip}">${e.dur}</span>
         <span class="cdwn ${cd.cls}">${cd.lbl}</span>
       </div>`;
    list.appendChild(card);
  });

  // speaking window note
  if(activeF === 'all' || activeF === 'esl'){
    const note = document.createElement('div');
    note.className = 'note';
    note.innerHTML =
      '<strong>Speaking windows:</strong><br>' +
      'CIE ESL Speaking (0510/31): 30 Mar – 27 Apr 2026 · arranged by your centre<br>' +
      'OxAQA ESL Speaking: 27 Mar – 1 May 2026 · submit by 4 May 2026';
    list.appendChild(note);
  }
}

/* ── EVENTS ── */
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab');
  if(!b) return;
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  activeTab = b.dataset.tab;
  render();
});

document.getElementById('fbar').addEventListener('click', e => {
  const b = e.target.closest('.fb');
  if(!b) return;
  document.querySelectorAll('.fb').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  activeF = b.dataset.f;
  render();
});

render();
setInterval(render, 30000); // refresh every 30s
</script>
</body>
</html>
