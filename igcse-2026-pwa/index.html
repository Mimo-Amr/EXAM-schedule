<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Egypt IGCSE 2026</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="shortcut icon" href="favicon.svg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#09090f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="description" content="Egypt IGCSE May/June 2026 exam schedule — live Cairo countdown">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IGCSE 2026">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body data-bg="aurora">

<canvas id="cvs" aria-hidden="true"></canvas>
<div class="bgfx" id="bgfx" aria-hidden="true"><i></i><i></i><i></i></div>

<header class="bar" id="bar">
  <div class="bar-in">
    <div class="logo" id="logo">My <span>exams</span></div>
    <div class="bar-r">
      <button class="ibtn" id="data-btn" type="button" aria-label="Schedule file">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 11.5v5m-2.5-2.5L12 16.5l2.5-2.5"/></svg>
      </button>
      <button class="ibtn" id="bg-btn" type="button" aria-label="Change background">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M12 2l1.8 5.7 5.7 1.8-5.7 1.8L12 17l-1.8-5.7L4.5 9.5l5.7-1.8z"/><path d="M19 15l.9 2.6 2.6.9-2.6.9L19 22l-.9-2.6-2.6-.9 2.6-.9z" opacity=".7"/></svg>
      </button>
      <button class="clk" id="clk" type="button" aria-label="Change time zone">
        <span id="clk-d"></span>
        <span id="clk-t"></span>
      </button>
    </div>
  </div>
</header>

<main>
  <section class="hero">
    <h1>Exam schedule</h1>
    <p id="summary" aria-live="polite"></p>
  </section>

  <div class="seg" id="tabs" role="tablist" hidden>
    <i class="seg-ind" id="ind"></i>
    <button class="tab active" data-tab="upcoming" role="tab">Upcoming <span class="cnt" id="uc">0</span></button>
    <button class="tab" data-tab="done" role="tab">Done <span class="cnt" id="dc">0</span></button>
  </div>

  <div class="fbar" id="fbar" hidden></div>

  <div id="list"></div>

  <footer class="foot"><span id="ver"></span> · <button id="whatsnew" type="button">What's new</button></footer>
</main>

<div class="scrim" id="scrim"></div>
<section class="sheet glass" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title" tabindex="-1" inert>
  <div class="grab"><i></i></div>
  <div class="sh-body" id="sh-body"></div>
</section>

<input type="file" id="file-in" accept=".json,application/json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>

</body>
</html>
