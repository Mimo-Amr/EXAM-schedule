<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Egypt IGCSE 2026</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="shortcut icon" href="favicon.svg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#09090f">
<meta name="description" content="Egypt IGCSE May/June 2026 exam schedule — live Cairo countdown">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IGCSE 2026">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="cvs"></canvas>

<header>
  <div class="hdr">
    <div class="logo">Egypt IGCSE <span>2026</span></div>
    <div class="clk">
      <span id="clk-d"></span>
      <span id="clk-t"></span>
    </div>
  </div>
</header>

<main>
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="upcoming">
      Upcoming <span class="cnt" id="uc">0</span>
    </button>
    <button class="tab" data-tab="done">
      Done <span class="cnt" id="dc">0</span>
    </button>
  </div>

  <div class="fbar" id="fbar">
    <span class="fcat">Filter</span>
    <button class="fb active" data-f="all">
      <span class="dot" style="background:#777"></span>All
    </button>
    <button class="fb" data-f="phy">
      <span class="dot" style="background:#3b9eff"></span>Physics
    </button>
    <button class="fb" data-f="bio">
      <span class="dot" style="background:#3ecf8e"></span>Biology
    </button>
    <button class="fb" data-f="che">
      <span class="dot" style="background:#a78bfa"></span>Chemistry
    </button>
    <button class="fb" data-f="mat">
      <span class="dot" style="background:#f4a13a"></span>Maths
    </button>
    <button class="fb" data-f="esl">
      <span class="dot" style="background:#f472b6"></span>English ESL
    </button>
  </div>

  <div id="list"></div>
</main>

<script src="app.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>

</body>
</html>
